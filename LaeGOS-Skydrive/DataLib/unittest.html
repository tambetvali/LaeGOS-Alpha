<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataLib unit tests</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #10191d; color: #e8f0f3; }

  <h1>DataLib unit tests</h1>
  <p>Serve the repository root and open <code>LaeGOS-Skydrive/DataLib/unittest.html</code>.</p>

  <ol id="results"></ol>
